<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tableau Public UI Mock</title>
    <link
      href="https://fonts.googleapis.com/css?family=Segoe+UI:400,600"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- Link external CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="topbar">Auto Analyst</div>

    <div class="container">
      <div class="sidebar">
        <h2>Connect</h2>

        <div class="section">
          <div class="section-title">To a File</div>
          <ul>
            <li id="excel-btn">Microsoft Excel</li>
            <li id="text-btn">Text file</li>

            <li>JSON file</li>
            <li>Microsoft Access</li>
            <li>PDF file</li>
            <li>Spatial file</li>
            <li>Statistical file</li>
          </ul>
        </div>
      </div>

      <div class="main">
        <h3>Open</h3>
        <div class="open-tiles"></div>
      </div>
    </div>

    <!-- Hidden file inputs -->
    <input
      type="file"
      id="excel-file-input"
      accept=".xls,.xlsx"
      style="display: none"
    />
    <input
      type="file"
      id="text-file-input"
      accept=".csv,.txt"
      style="display: none"
    />

    <!-- Link external JS -->
    <script src="script.js"></script>
  </body>
</html>
